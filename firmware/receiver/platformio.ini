; PlatformIO Project Configuration File
;
; ESP32-C3 receiver / gateway.
;
; Phase 1: receives SensorData packets over ESP-NOW and prints them on the
; serial console. The room-summary display comes later.

[platformio]
default_envs = c3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../../shared

lib_deps =
    adafruit/Adafruit NeoPixel

; ESP32-C3 devkit (generic 4 MB C3 target, same as the sensor nodes).
; The Wake-on-LAN proxy is compiled in by default; add -DWOL_ENABLED=0 to
; build_flags to leave it out (saves ~35 KB of flash).
[env:c3]
board = esp32-c3-devkitm-1
