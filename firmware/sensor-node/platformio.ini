; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = oled042

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../../shared

lib_deps =
    adafruit/Adafruit SHT31 Library
    olikraus/U8g2

; Onboard 0.42" OLED board (display on GPIO5/6).
[env:oled042]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DBOARD_OLED_042

; Seeed XIAO ESP32C3 (I2C on GPIO6/7, no display).
[env:xiao-c3]
board = seeed_xiao_esp32c3
build_flags = ${env.build_flags} -DBOARD_XIAO_C3

; Waveshare ESP32-C3-Zero (no display).
[env:c3-zero]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DBOARD_C3_ZERO

; Debug builds: keep the board awake and USB CDC available for serial logs.
[env:oled042-debug]
extends = env:oled042
build_flags = ${env:oled042.build_flags} -DDEBUG_KEEP_AWAKE=1

[env:xiao-c3-debug]
extends = env:xiao-c3
build_flags = ${env:xiao-c3.build_flags} -DDEBUG_KEEP_AWAKE=1

[env:c3-zero-debug]
extends = env:c3-zero
build_flags = ${env:c3-zero.build_flags} -DDEBUG_KEEP_AWAKE=1
